name: Build and Push Explorer Images

on:
  push:
    branches: [ main ]
    paths:
      - "backend/**"
      - "frontend/**"
      - ".github/workflows/docker-publish.yml"
  pull_request:
    branches: [ main ]
    paths:
      - "backend/**"
      - "frontend/**"
      - ".github/workflows/docker-publish.yml"
  workflow_dispatch:

env:
  GHCR_REGISTRY: ghcr.io
  GHCR_BACKEND_IMAGE: clutchprotocol/clutch-explorer-backend
  GHCR_FRONTEND_IMAGE: clutchprotocol/clutch-explorer-frontend

permissions:
  contents: read
  packages: write

jobs:
  build-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.GHCR_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract backend Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.GHCR_REGISTRY }}/${{ env.GHCR_BACKEND_IMAGE }}
          tags: |
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}
      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  build-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.GHCR_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract frontend Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.GHCR_REGISTRY }}/${{ env.GHCR_FRONTEND_IMAGE }}
          tags: |
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}
      - name: Build and push frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VITE_EXPLORER_API_URL=/api

  # clutch-deploy pins every image to an exact tag and deploys only what is pinned, so the dispatch
  # names the tags this run pushed: metadata-action's type=sha, sha-<first 7 of the commit>, the same
  # for both images. clutch-deploy checks that ghcr.io has them, pins them, and moves no other image.
  #
  # No `continue-on-error` any more. With pins, a dispatch that fails leaves the new images unpinned:
  # stage keeps the old ones while this run reports green. A failed dispatch must look failed.
  trigger-stage-deploy:
    needs: [build-backend, build-frontend]
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    steps:
      - name: Check the dispatch token is present
        env:
          TOKEN: ${{ secrets.CLUTCH_DEPLOY_DISPATCH_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::CLUTCH_DEPLOY_DISPATCH_TOKEN is not set on this repository."
            echo "::error::The images WERE pushed. Stage will NOT deploy them."
            exit 1
          fi

      - name: Name the tag this run pushed
        id: tag
        run: echo "sha=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Trigger deploy-stage in clutch-deploy
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.CLUTCH_DEPLOY_DISPATCH_TOKEN }}
          repository: clutchprotocol/clutch-deploy
          event-type: deploy-stage
          client-payload: '{"set_images": "clutch-explorer-backend=${{ steps.tag.outputs.sha }} clutch-explorer-frontend=${{ steps.tag.outputs.sha }}"}'
